name: Release Windows

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          "tag=v$version" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Check whether release already exists
        id: existing
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "${{ steps.version.outputs.tag }}" *> $null
          "exists=$(if ($LASTEXITCODE -eq 0) {'true'} else {'false'})" >> $env:GITHUB_OUTPUT
      - uses: actions/setup-node@v4
        if: steps.existing.outputs.exists != 'true'
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
        if: steps.existing.outputs.exists != 'true'
      - uses: swatinem/rust-cache@v2
        if: steps.existing.outputs.exists != 'true'
        with:
          workspaces: src-tauri
      - name: Install dependencies
        if: steps.existing.outputs.exists != 'true'
        run: npm install --no-audit --no-fund
      - name: Validate
        if: steps.existing.outputs.exists != 'true'
        run: |
          npm run typecheck
          npm test
          cd src-tauri
          cargo test
      - name: Build Tauri Windows app
        if: steps.existing.outputs.exists != 'true'
        run: npx tauri build
      - name: Stage release assets
        if: steps.existing.outputs.exists != 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item src-tauri/target/release/criacord.exe "release/CriaCord-Portable-${{ steps.version.outputs.version }}-x64.exe"
          $installer = Get-ChildItem src-tauri/target/release/bundle/nsis -Filter '*.exe' | Select-Object -First 1
          if (-not $installer) { throw 'NSIS installer not found' }
          Copy-Item $installer.FullName "release/CriaCord-${{ steps.version.outputs.version }}-x64-Setup.exe"
      - name: Create GitHub Release
        if: steps.existing.outputs.exists != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ steps.version.outputs.tag }}"
          $version = "${{ steps.version.outputs.version }}"
          @"
          CriaCord $version

          Build Tauri 2 para Windows x64, sem Electron/Chromium empacotado.

          - executável portátil
          - instalador por usuário
          - WebRTC pela internet com ICE/STUN
          - TURN opcional como fallback
          - sem Radmin, IP manual, port forwarding ou UAC no uso normal

          A build passou por typecheck, testes JS, testes Rust e empacotamento Tauri no Windows CI.
          "@ | Set-Content release-notes.md -Encoding utf8
          gh release create $tag release/*.exe --target $env:GITHUB_SHA --title "CriaCord $tag" --notes-file release-notes.md
